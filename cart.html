<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>Your cart</title>
</head>
<body>
<header class="wrap site-header">
<a class="brand" href="index.html" data-site-name>[YOUR NAME]</a>
<nav aria-label="Main">
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="index.html#about">About</a>
<a href="#">Journal</a>
<a href="#">Contact</a>
<a class="cart-link" href="cart.html" aria-current="page" aria-label="Cart, 0 items"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11H6.2L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Cart (<span data-cart-count>0</span>)</span></a>
</nav>
</header>
<main class="wrap">
<h1 class="page-title">Your cart</h1>
<div class="cart-wrap">
<div class="lines" id="lines"></div>
<aside class="summary" id="summary" hidden>
<h2>Summary</h2>
<div class="nm"><span>Subtotal</span><span id="subtotal"></span></div>
<div class="nm"><span>Shipping</span><span style="color:var(--muted)">At checkout</span></div>
<div class="nm total"><span>Total</span><span id="total"></span></div>
<form id="checkout" style="display:flex;flex-direction:column;gap:16px">
<label>Name<input id="cname" autocomplete="name"></label>
<label>Email<input id="email" type="email" required autocomplete="email"></label>
<label>Note (optional, max 125 characters)<textarea id="note" rows="3" maxlength="125"></textarea></label>
<button class="btn" id="pay" type="submit" style="height:52px">Place order</button>
<p class="msg" id="msg" role="status"></p>
</form>
</aside>
</div>
</main>
<footer class="wrap site-footer">
<span>© <span data-year></span> <span data-site-name>[YOUR NAME]</span></span>
<span><a href="#">Shipping</a><a href="#">Returns</a><a href="#">Contact</a><button type="button" class="linkbtn" data-consent-open>Cookie settings</button></span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent.js"></script>
<script>Shop.renderChrome("cart");Shop.initCart();</script>
</body>
</html>
